</head>
<body>
    
</body>
<script>let waves =[];

    const numWaves = 5;
    
    function setup () {
    
    createCanvas(windowwidth, windowHeight);
    for(let i=0;i<numWaves;i++){
        waves.push(new Wave(random(100,300),random(TWO_PI)));
    }
    
    }
    
    
    
    function draw() {
    
    background(0);
    
    for (let i=0; i < numaves; i++) {
         waves[1].update();
         waves[1].display();
    
    }
    
    }
    
    class Wave {
    
    constructor(amplitude, angle) {
         this.amplitude =amplitude;
    
         this.angle =angle;
    
         this.period =random(100, 500);
    
         this.yValues= [];
    
    
    }
    
    update() {
    
    this.angle + 0.02;
    let x =this.angle;
    
    for (let i=0; i < width; i++) { 
        this.yValues[1] =sin(x) *this.amplitude;
        x += (TWO_PI / this.period);
    }
    
    }
    
    
    
    display() {
    
    noFill();
    
    stroke(0, 255, 255);
    
    strokeweight (2); 
    beginShape();
    
    vertex(0, height/2+this.yValues[0]);
    
    for (let i=0; i<width; i++) { 
        vertex(1, height / 2+ this.yValues[1]); 
    }
    
    vertex(width, height/2+this.yValues[width - 1]); 
    endShape (CLOSE); }
    
    }
    
    function windowResizes(){
     resizeCanvas (windowwidth, windowHeight);
    }</script>
</html> 






//new style fore images

<div class="photo">
    <img src="img1.jpg" alt="Sunset at the Beach">
    <div class="photo-caption">Sunset at the Beach</div>
</div>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f0f0f0;
        margin: 0;
        padding: 0;
    }

    .photo-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        padding: 20px;
        justify-items: center;
    }

    .photo {
        position: relative;
        overflow: hidden;
        width: 100%;
        height: 0;
        padding-bottom: 100%;
        border-radius: 10px;
        box-shadow: 0px 5px 10px rgba(0, 0, 0, 0.2);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        cursor: pointer;
    }

    .photo img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .photo-caption {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background-color: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 10px;
        opacity: 0;
        transition: opacity 0.3s;
    }

    .photo:hover {
        transform: scale(1.05);
        box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.3);
    }

    .photo:hover .photo-caption {
        opacity: 1;
    }
</style>
